# WP-F20, first step: proves that this repository may run workflows and push to its container registry.
# It runs only for the branch ci/probe and on request. The real pipeline is image.yml (WP-F20).
name: probe

on:
  push:
    branches: [ci/probe]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Versions
        run: |
          python --version
          docker --version
          docker buildx version
      - name: Push a one-layer probe image to the registry of the repository
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          printf 'FROM alpine:3.22\nLABEL org.opencontainers.image.source=https://github.com/%s\nCMD ["echo", "probe"]\n' "${GITHUB_REPOSITORY}" > Dockerfile.probe
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -f Dockerfile.probe -t "${IMAGE}:probe" .
          docker push "${IMAGE}:probe"
          echo "pushed ${IMAGE}:probe" >> "${GITHUB_STEP_SUMMARY}"
